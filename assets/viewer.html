<style>

set:2px}.hl:hover{opacity:.4}.marker{position:absolute;border-radius:50%;width:21px;height:21px;line-height:19px;padding:0;color:white;font-size:10px;font-weight:bold;border:1px solid white;z-index:3;transform:translate(-105%,-15%)}.manual{position:absolute;border:2px solid #bb9431;background:#ffe19b55;pointer-events:none}.draft{position:absolute;border:2px dashed #ba943b;background:#ffe29b33;pointer-events:none}.notes{background:#fafcf8;border-left:1px solid var(--line);overflow:auto;padding:14px 11px}.notes h3{margin:0 0 13px;font-size:13px}.note-card{background:white;border:1px solid var(--line);border-left:3px solid #8ba795;border-radius:6px;padding:11px 10px;margin:0 0 12px;cursor:pointer;font-size:12px;line-height:1.8;scroll-margin-top:10px}.note-card.active{border-color:#659070;box-shadow:0 0 0 2px #e1ecdc}.note-card h4{font-size:12px;margin:0 0 6px}.quote{font-size:10px;color:#7b827d;border-left:2px solid #d7dfd4;padding-left:6px;margin:7px 0;line-height:1.6;overflow-wrap:anywhere}.note-card p{margin:7px 0 0}.note-card .ref{margin-top:7px}.manual-card{border-left-color:#bd9633}.page-caption{font-size:11px;color:var(--muted);padding-top:10px;text-align:center;line-height:1.5}.status{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#294b3c;color:white;padding:10px 18px;border-radius:7px;z-index:30;max-width:85vw;box-shadow:0 5px 25px #0002;display:none}.dialog-backdrop{position:fixed;inset:0;background:#1c2c2544;z-index:40;display:none;align-items:center;justify-content:center}.dialog{background:white;border-radius:12px;padding:22px;width:min(480px,90vw)}.dialog h3{margin-top:0}.dialog textarea{width:100%;height:120px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:10px;line-height:1.8}.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.empty{font-size:12px;color:#8b928a;line-height:1.9}.help{font-size:11px;color:var(--muted);line-height:1.7;margin:8px 0}.copy-box{height:280px!important}@media(max-width:1080px){.viewer-body{grid-template-columns:minmax(300px,1fr) 185px}.layout{grid-template-columns:40% 60%}.left-head,.step{padding-inline:18px}.header-actions button{font-size:11px}.brand span{display:none}}@media(max-width:800px){header{height:auto;min-height:68px;padding:12px;flex-wrap:wrap}.layout{display:block;height:auto}.left{height:65vh;border-right:0}.right{height:85vh}.viewer-body{grid-template-columns:minmax(250px,1fr) 175px}.paper-title{font-size:17px}}@media print{header,.toolbar,.tabs,.header-actions{display:none}.layout{display:block;height:auto}.left,.right{height:auto;overflow:visible}.step{display:block!important}.viewer-body{display:block}.notes{display:block}.page-stage{max-width:100%}.left{border:0}}

</style></head><body>
<header><div class="brand">jzk’s PDF Viewer <span>精读与原文，一起读</span></div><div class="header-actions"><button id="focus-mode">专注读原文</button><button id="copy-all">复制完整精读</button><button id="download-md">下载精读正文</button><button id="download-pdf">下载批注PDF</button></div></header>
<main class="layout"><section class="left" id="left"><div class="left-head"><div class="eyebrow">PAPER READING · 五步精读</div><h1 class="paper-title" id="paper-title"></h1><div class="meta" id="paper-meta"></div><p class="summary" id="summary"></p></div><nav class="tabs" id="tabs" aria-label="精读步骤"></nav><div id="steps"></div></section>
<section class="right"><div class="toolbar"><div class="group"><button id="prev" aria-label="上一页">←</button><label>PDF <input id="page-number" type="number" min="1" value="1" aria-label="PDF页码"></label><span id="page-count"></span><button id="next" aria-label="下一页">→</button></div><div class="group"><select id="zoom" aria-label="页面缩放"><option value="100">适合宽度</option><option value="125">125%</option><option value="160">160%</option></select><button id="draw">框选勾画</button><button id="undo">撤销勾画</button></div><div class="group"><button id="export-notes">导出笔记</button><button id="import-notes">导入笔记</button><button id="source-pdf">原PDF</button></div></div>
<div class="filterbar"><label>批注 <select id="note-filter"><option value="all">全部</option><option value="method">方法</option><option value="result">结果</option><option value="question">疑问</option><option value="mine">我的笔记与纠正</option></select></label><label><input type="checkbox" id="show-highlights" checked> 显示高亮</label><span class="quiet" id="reading-state"></span></div><div class="viewer-body"><div class="paper-scroll" id="paper-scroll"><div class="page-stage" id="page-stage"><img id="page-image" alt="论文原页"><div class="overlay" id="overlay"></div></div><div class="page-caption" id="page-caption"></div></div><aside class="notes" id="notes" aria-label="当前页中文批注"></aside></div></section></main>
<div class="status" id="status" role="status"></div><input type="file" accept="application/json,.json" id="import-file" hidden>
<div class="dialog-backdrop" id="note-dialog"><div class="dialog"><h3>为这处勾画写一句笔记</h3><p class="help">保存到当前浏览器。导出笔记可备份，并可在另一浏览器导入。</p><textarea id="manual-text" aria-label="手工批注内容" placeholder="可留空，仅保留勾画"></textarea><div class="actions"><button id="cancel-note">取消</button><button class="primary" id="save-note">保存勾画</button></div></div></div>
<div class="dialog-backdrop" id="copy-dialog"><div class="dialog"><h3>复制精读正文</h3><p class="help">当前浏览器限制直接复制。文字已选中，可按 Ctrl+C 复制。</p><textarea id="copy-text" class="copy-box" aria-label="待复制正文"></textarea><div class="actions"><button id="close-copy">关闭</button></div></div></div>
<script>/*__PDFLIB__*/</script><script id="payload" type="application/json">/*__PAYLOAD__*/</script><script>
const DATA=JSON.parse(document.getElementById('payload').textContent),CARD=DATA.card;
const $=s=>document.getElementById(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors=['#2872a7','#7856a0','#27876d','#b27321','#b75463'],short=['研究问题','研究方法','关键结果','证据与结论','局限与启发'];
let page=1,step=1,selected=null,drawing=false,start=null,pending=null,manual=[],toastTimer,zoom=100;
let focusMode=false,noteFilter='all',showHighlights=true,editingId=null,correctionTarget=null,stateTimer;
const progressKey='jzks-pdf-progress:v2:'+CARD.source.sha256;
const storageKey='jzks-pdf-viewer:v1:'+CARD.source.sha256,annById=Object.fromEntries(CARD.annotations.map(a=>[a.id,a]));
function toast(s){$('status').textContent=s;$('status').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('status').style.display='none',3500)}
function load(){try{const d=JSON.parse(localStorage.getItem(storageKey)||'null');if(d&&d.source_sha256===CARD.source.sha256&&validNotes(d.annotations))manual=d.annotations}catch(e){}}
function validNotes(a){return Array.isArray(a)&&a.length<=3000&&a.every(n=>n&&typeof n.id==='string'&&Number.isInteger(n.page)&&n.page>=1&&n.page<=DATA.pages.length&&typeof n.text==='string'&&n.text.length<20000&&Array.isArray(n.rect)&&n.rect.length===4&&n.rect.every(v=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=1)&&n.rect[2]>n.rect[0]&&n.rect[3]>n.rect[1])}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({schema:'jzks-manual-notes/v1',source_sha256:CARD.source.sha256,annotations:manual}));return true}catch(e){toast('浏览器无法本地保存，请使用“导出笔记”备份。');return false}}
function download(name,data,type='application/json'){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function pdfDownload(b64,name){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));download(name,bytes,'application/pdf')}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch(e){const t=$('copy-text');t.value=text;$('copy-dialog').style.display='flex';t.focus();t.select();try{if(document.execCommand('copy')){$('copy-dialog').style.display='none';toast('已复制')}}catch(err){}}}
function stepMarkdown(s){let out='## '+s.title+'\n\n';s.paragraphs.forEach(p=>{out+='### '+p.title+'\n\n'+(p.layer==='author'?'[作者报告] ':'[AI解读] ')+p.text+'\n\n'+p.refs.map(r=>r+' · PDF第'+annById[r].page+'页').join('；')+'\n\n'});return out}
function setStep(n,scroll=true){step=n;saveProgress();document.querySelectorAll('.step').forEach(e=>e.hidden=Number(e.dataset.step)!==n);document.querySelectorAll('.tabs button').forEach(e=>e.classList.toggle('active',Number(e.dataset.step)===n));if(scroll)$('left').scrollTop=$('tabs').offsetTop-$('left').offsetTop}
function initReading(){
 $('paper-title').textContent=CARD.paper.title;$('paper-meta').textContent=CARD.paper.authors+' · '+DATA.pages.length+'页 · '+CARD.annotations.length+'处原文批注';$('summary').textContent=CARD.summary;
 CARD.steps.forEach(s=>{const b=document.createElement('button');b.textContent=String(s.id).padStart(2,'0')+' '+short[s.id-1];b.dataset.step=s.id;b.onclick=()=>setStep(s.id);$('tabs').append(b);
 const container=document.createElement('section');container.className='step';container.dataset.step=s.id;
 container.innerHTML='<div class="step-heading"><h2>'+esc(String(s.id).padStart(2,'0')+' '+s.title)+'</h2><button class="copy-step">复制本节</button></div>';
 container.querySelector('.copy-step').onclick=()=>copy(stepMarkdown(s));
 s.paragraphs.forEach((p,i)=>{const a=document.createElement('article');a.className='reading-block';a.id='block-'+s.id+'-'+i;a.dataset.refs=p.refs.join(' ');a.innerHTML='<div class="block-top"><span class="tag '+(p.layer==='analysis'?'analysis':'')+'">'+(p.layer==='author'?'作者报告':'AI解读')+'</span><h3>'+esc(p.title)+'</h3></div><p>'+esc(p.text)+'</p><div class="refs"></div>';
 p.refs.forEach(id=>{const note=annById[id],button=document.createElement('button');button.className='ref';button.dataset.ref=id;button.textContent=id+' · PDF第'+note.page+'页'+(note.anchor_status==='matched'?' ↗':'（页内位置待定位）');button.onclick=()=>selectAnnotation(id);a.querySelector('.refs').append(button)});container.append(a)});$('steps').append(container)});setStep(step,false)
}
function setRect(el,r){el.style.left=r[0]*100+'%';el.style.top=r[1]*100+'%';el.style.width=(r[2]-r[0])*100+'%';el.style.height=(r[3]-r[1])*100+'%'}
function renderPage(){const p=DATA.pages[page-1];$('page-image').src=p.image;$('page-image').alt='论文PDF第'+page+'页';$('page-number').value=page;$('page-caption').textContent='PDF第'+page+'页 / 共'+DATA.pages.length+'页 · 原页版式保留';$('overlay').replaceChildren();$('overlay').classList.toggle('drawing',drawing);
 CARD.annotations.filter(a=>a.page===page&&matchesFilter(a)&&showHighlights).forEach(a=>{a.normalized_rects.forEach(r=>{const el=document.createElement('button');el.className='hl'+(selected===a.id?' active':'');el.style.background=colors[a.step-1];el.style.color=colors[a.step-1];el.title=a.id+' '+a.title;el.setAttribute('aria-label','定位 '+a.id+' '+a.title);setRect(el,r);el.onclick=e=>{if(!drawing){e.stopPropagation();selectAnnotation(a.id)}};$('overlay').append(el)});
 if(a.normalized_rects.length){const marker=document.createElement('button'),r=a.normalized_rects[0];marker.className='marker';marker.style.left=r[0]*100+'%';marker.style.top=r[1]*100+'%';marker.style.background=colors[a.step-1];marker.textContent=a.id.replace('E','');marker.setAttribute('aria-label','批注 '+a.id);marker.onclick=()=>!drawing&&selectAnnotation(a.id);$('overlay').append(marker)}});
 manual.filter(n=>n.page===page&&n.kind!=='correction'&&showHighlights&&(noteFilter==='all'||noteFilter==='mine')).forEach(n=>{const el=document.createElement('div');el.className='manual';setRect(el,n.rect);$('overlay').append(el)});renderNotes();applyZoom();saveProgress();
}
function applyZoom(){$('page-stage').style.width=zoom+'%';$('page-stage').style.maxWidth=zoom+'%'}
function matchesFilter(a){return noteFilter==='all'||(noteFilter==='mine'&&manual.some(n=>n.target===a.id))||a.kind===noteFilter}
function renderNotes(){const target=$('notes');target.innerHTML='<h3>原页批注 · PDF '+page+'</h3>';
const items=CARD.annotations.filter(a=>a.page===page&&matchesFilter(a));
if(!items.length)target.innerHTML+='<p class="empty">当前筛选下没有AI批注。</p>';
items.forEach(a=>{const el=document.createElement('article');el.className='note-card'+(selected===a.id?' active':'');el.id='note-'+a.id;el.style.borderLeftColor=colors[a.step-1];el.tabIndex=0;
el.innerHTML='<h4>'+esc(a.id+' '+a.title)+'</h4><span class="tag '+(a.layer==='analysis'?'analysis':'')+'">'+(a.layer==='author'?'作者报告':'AI解读')+'</span><div class="quote">'+esc(a.quote)+'</div><p>'+esc(a.explanation)+'</p>';
el.onclick=()=>selectAnnotation(a.id);el.onkeydown=e=>{if(e.target===el&&e.key==='Enter')selectAnnotation(a.id)};
manual.filter(n=>n.target===a.id).forEach(n=>{const c=document.createElement('div');c.className='correction';c.textContent='我的纠正：'+n.text;el.append(c);addEditButtons(c,n)});
const btn=document.createElement('button');btn.textContent='补充我的纠正';btn.className='ref';btn.onclick=e=>{e.stopPropagation();openEditor(null,a)};el.append(btn);target.append(el)});
if(noteFilter==='all'||noteFilter==='mine')manual.filter(n=>n.page===page&&n.kind!=='correction').forEach(n=>{const el=document.createElement('article');el.className='note-card manual-card';el.innerHTML='<h4>我的勾画</h4><p>'+esc(n.text||'已保留框选位置')+'</p>';addEditButtons(el,n);target.append(el)})}
function addEditButtons(el,n){const bar=document.createElement('div');bar.className='note-actions';for(const [label,fn] of [['编辑',()=>openEditor(n)],['删除',()=>{manual=manual.filter(x=>x.id!==n.id);save();renderPage()}]]){const b=document.createElement('button');b.textContent=label;b.onclick=e=>{e.stopPropagation();fn()};bar.append(b)}el.append(bar)}
function openEditor(n=null,a=null){editingId=n?.id||null;correctionTarget=n?.target||a?.id||null;pending=n?.rect||a?.normalized_rects[0]||[.02,.02,.08,.04];$('manual-text').value=n?.text||'';$('note-dialog').style.display='flex';$('manual-text').focus()}
function selectAnnotation(id){const a=annById[id];if(!a)return;selected=id;page=a.page;if(!matchesFilter(a)){noteFilter='all';$('note-filter').value='all'}renderPage();setStep(a.step,false);
 document.querySelectorAll('.reading-block').forEach(e=>e.classList.toggle('selected',e.dataset.refs.split(' ').includes(id)));document.querySelectorAll('.ref[data-ref]').forEach(e=>e.classList.toggle('selected',e.dataset.ref===id));
 const block=document.querySelector('.reading-block.selected');if(block)block.scrollIntoView({block:'center',behavior:'smooth'});
 const card=$('note-'+id);if(card)card.scrollIntoView({block:'nearest',behavior:'smooth'});
 if(a.normalized_rects.length){const r=a.normalized_rects[0],stage=$('page-stage'),area=$('paper-scroll');area.scrollTop=stage.offsetTop-area.offsetTop+r[1]*stage.offsetHeight-area.clientHeight*.3}else toast('已跳到原文页面，这条引句尚未精确定位。')
}
function movePage(n){page=Math.max(1,Math.min(DATA.pages.length,n));selected=null;renderPage();$('paper-scroll').scrollTop=0}
function point(e){const r=$('overlay').getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
$('overlay').addEventListener('pointerdown',e=>{if(!drawing||e.button!==0)return;e.preventDefault();start=point(e);$('overlay').setPointerCapture(e.pointerId);const el=document.createElement('div');el.className='draft';el.id='draft';$('overlay').append(el)});
$('overlay').addEventListener('pointermove',e=>{if(!start)return;const q=point(e),r=[Math.min(start[0],q[0]),Math.min(start[1],q[1]),Math.max(start[0],q[0]),Math.max(start[1],q[1])];setRect($('draft'),r)});
$('overlay').addEventListener('pointerup',e=>{if(!start)return;const q=point(e);pending=[Math.min(start[0],q[0]),Math.min(start[1],q[1]),Math.max(start[0],q[0]),Math.max(start[1],q[1])];start=null;$('draft')?.remove();if(pending[2]-pending[0]<.008||pending[3]-pending[1]<.004){pending=null;return}editingId=null;correctionTarget=null;$('manual-text').value='';$('note-dialog').style.display='flex';$('manual-text').focus()});
$('overlay').addEventListener('pointercancel',()=>{start=null;pending=null;$('draft')?.remove()});
$('save-note').onclick=()=>{if(!pending)return;const old=manual.find(n=>n.id===editingId);const n={...(old||{}),id:editingId||'M'+Date.now().toString(36),page:old?.page||page,rect:pending,text:$('manual-text').value.slice(0,19000),created_at:old?.created_at||new Date().toISOString()};if(correctionTarget){n.kind='correction';n.target=correctionTarget;n.page=annById[correctionTarget].page}if(editingId)manual=manual.map(x=>x.id===editingId?n:x);else manual.push(n);pending=null;editingId=null;correctionTarget=null;$('note-dialog').style.display='none';const ok=save();renderPage();if(ok)toast('笔记已保存')};
$('cancel-note').onclick=()=>{pending=null;editingId=null;correctionTarget=null;$('note-dialog').style.display='none'};
$('draw').onclick=()=>{drawing=!drawing;$('draw').classList.toggle('on',drawing);$('draw').textContent=drawing?'结束勾画':'框选勾画';$('overlay').classList.toggle('drawing',drawing);toast(drawing?'在原页上拖动框选，松开后可填写批注。':'已结束勾画')};
$('undo').onclick=()=>{if(!manual.length)return toast('还没有手工勾画');manual.pop();save();renderPage();toast('已撤销最近一条勾画')};
$('prev').onclick=()=>movePage(page-1);$('next').onclick=()=>movePage(page+1);$('page-number').max=DATA.pages.length;$('page-count').textContent='/ '+DATA.pages.length;$('page-number').onchange=()=>movePage(parseInt($('page-number').value)||1);
$('zoom').onchange=()=>{zoom=Number($('zoom').value);applyZoom();saveProgress()};
$('copy-all').onclick=()=>copy(DATA.markdown);$('download-md').onclick=()=>download('paper-card.md',DATA.markdown,'text/markdown;charset=utf-8');$('download-pdf').onclick=()=>exportCombinedPDF();$('source-pdf').onclick=()=>pdfDownload(DATA.pdf,'original-paper.pdf');$('close-copy').onclick=()=>$('copy-dialog').style.display='none';
$('export-notes').onclick=()=>download('my-annotations.json',JSON.stringify({schema:'jzks-manual-notes/v1',source_sha256:CARD.source.sha256,annotations:manual},null,2));
$('import-notes').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error('文件过大');const d=JSON.parse(await f.text());if(d.schema!=='jzks-manual-notes/v1'||d.source_sha256!==CARD.source.sha256||!validNotes(d.annotations))throw Error('请选择同一篇论文导出的有效笔记');const unique=new Map([...manual,...d.annotations].map(n=>[n.id,n]));manual=[...unique.values()];save();renderPage();toast('笔记已导入')}catch(err){toast(err.message||'笔记文件无法读取')}finally{e.target.value=''}};

function saveProgress(){try{localStorage.setItem(progressKey,JSON.stringify({page,step,zoom,focusMode,noteFilter,showHighlights,left:$('left').scrollTop,top:$('paper-scroll').scrollTop}));$('reading-state').textContent='进度自动保存'}catch(e){$('reading-state').textContent='当前浏览器未保存进度'}}
function loadProgress(){try{const d=JSON.parse(localStorage.getItem(progressKey)||'null');if(!d)return;page=Math.max(1,Math.min(DATA.pages.length,Number(d.page)||1));step=[1,2,3,4,5].includes(d.step)?d.step:1;zoom=[100,125,160].includes(d.zoom)?d.zoom:100;focusMode=!!d.focusMode;noteFilter=['all','method','result','question','mine'].includes(d.noteFilter)?d.noteFilter:'all';showHighlights=d.showHighlights!==false;return d}catch(e){}}
$('focus-mode').onclick=()=>{focusMode=!focusMode;applyPreferences();saveProgress()};
$('note-filter').onchange=()=>{noteFilter=$('note-filter').value;renderPage()};
$('show-highlights').onchange=()=>{showHighlights=$('show-highlights').checked;renderPage()};
function applyPreferences(){document.querySelector('.layout').classList.toggle('focus',focusMode);$('focus-mode').textContent=focusMode?'返回五步精读':'专注读原文';$('zoom').value=zoom;$('note-filter').value=noteFilter;$('show-highlights').checked=showHighlights}
for(const id of ['left','paper-scroll'])$(id).addEventListener('scroll',()=>{clearTimeout(stateTimer);stateTimer=setTimeout(saveProgress,180)});
/*__EXPORT_CODE__*/
load();const restored=loadProgress();initReading();applyPreferences();renderPage();if(restored)requestAnimationFrame(()=>{$('left').scrollTop=restored.left||0;$('paper-scroll').scrollTop=restored.top||0});

</script></body></html>
